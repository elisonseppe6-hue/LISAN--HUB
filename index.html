<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LISAN HUB - Huduma za kidijitali kwa kutumia tokeni">
  <title>LISAN HUB</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">LISAN <span>HUB</span></div>
  <button class="login-btn">Ingia</button>
</header>

<main>
  <section class="hero">
    <div class="badge">HUDUMA ZA KIDIJITALI</div>
    <h1>Karibu LISAN HUB</h1>
    <p>Chagua huduma unayohitaji, tumia tokeni zako, na pata huduma kwa urahisi.</p>
    <button class="primary" onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'})">
      Angalia Huduma
    </button>
  </section>

  <section id="services" class="services-section">
    <div class="section-title">
      <h2>Huduma za LISAN HUB</h2>
      <p>Huduma 5 za mwanzo za MVP</p>
    </div>
    <div id="service-list" class="service-grid">
      <p>Inapakia huduma...</p>
    </div>
  </section>
</main>

<footer><p>© 2026 LISAN HUB. Huduma za kidijitali.</p></footer>
<script src="/app.js"></script>
</body>
</html>
